services:
  flowqueue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowqueue
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/flowqueue.db
      - LEASE_SECONDS=60
    volumes:
      - flowqueue-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  flowqueue-data:
